<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="../AmazonClone/style.css" rel="Stylesheet">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="navbar-logo border">
                <div class="logo"></div>
            </div>
            <div class="nav-address-borde border">
                <p class="deliver-font">Deliver to</p>
                <div class="location-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-font">India</p>
                </div>
            </div>
            <!-- box 3 in Header -->
            <div class="nav-search">
                <select class="search-select">
                    <option>
                        All
                    </option>                   
                </select >
                <input type="search" placeholder="Search Amazon" class="search-input">
                <div class="nav-search-icon search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <!-- box 4 -->
             <div class="navbar-sign-in border">
                <p class="text1">Hello,sign in</p>
                <p class="text2">Account & Lists</p>
             </div>
             <div class="langEn border">
                <div class="language-logo">
             </div>
             </div>
<!-- box 5 -->
             <div class="navbar-return border">
                <p class="text1">Returns</p>
                <p class="text2">& Orders</p>
             </div>
             <!-- box 6 -->
              <div class="nav-cart border">
                <i class="fa-solid fa-cart-shopping"></i>
                Cart
              </div>
            </div>
    </header>
    <main>

    </main>
    <footer>

    </footer>
</body>
</html>
